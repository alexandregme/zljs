name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Skip the version commit this workflow pushes itself
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write # npm Trusted Publishing (OIDC) + provenance

    steps:
      # Check out main (not the event sha) so a queued run sees the previous release commit
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Determine bump
        id: bump
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: echo "type=$(printf '%s\n' "$COMMIT_MESSAGE" | ./scripts/bump-type.sh)" >> "$GITHUB_OUTPUT"

      - name: Bump version
        id: version
        env:
          HUSKY: "0"
        run: |
          npm version "${{ steps.bump.outputs.type }}" -m "chore(release): v%s"
          echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Push changes and tags
        run: git push origin main --follow-tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.version.outputs.tag }}" --generate-notes

      # Trusted Publishing needs npm >= 11.5.1; prepublishOnly runs the library build
      - name: Publish to npm
        run: |
          npm install -g npm@11
          npm publish --provenance --access public
